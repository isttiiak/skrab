packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for dependency versions across every workspace package.
# Bump here, not in individual package.json files.
catalog:
  # Core
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@types/node": ^26.1.1
  typescript: ^7.0.2

